[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rdesign"
version = "0.0.1"
description = "Maximin robust Bayesian experimental design with Sibson's alpha-mutual information and PAC-Bayesian design policies"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Hany Abdulsamad", email = "hany@robot-learning.de"},
    {name = "Sahel Iqbal", email = "sahel13miqbal@proton.me"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typing_extensions",
    "numpy",
    "scipy",
    "chex",
    "jax",
    "jaxlib",
    "jaxopt",
    "optax",
    "flax",
    "distrax",
    "matplotlib",
]

[project.urls]
Paper = "https://arxiv.org/abs/2603.14094"
Repository = "https://github.com/hanyas/robust_design"

[tool.setuptools]
packages = ["rdesign"]
